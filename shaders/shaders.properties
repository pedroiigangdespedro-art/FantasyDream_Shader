# Paramètres du pipeline Iris / OptiFine
-version 430
shadowMapResolution=2048
shadowDistance=120.0

# Tampons de rendu pour le PBR et le Post-Processing
colortex0=RGBA16F    # Couleur principale / Albedo
colortex1=RGBA16F    # Normals / PBR Specular
colortex2=RGBA16F    # Emissive / Lightmaps / Bloom mask
